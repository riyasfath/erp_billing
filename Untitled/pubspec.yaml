name: ecommerce_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0

  # --- Added for auth feature ---
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  pdf: ^3.11.1
  path_provider: ^2.1.4

  # --- Added for persisted "recent searches" on the Shop screen ---
  shared_preferences: ^2.3.3

  # --- Added for the admin panel's product image upload ---
  image_picker: ^1.1.2

  # --- Added for online payment at checkout ---
  razorpay_flutter: ^1.4.0

  # --- Added for admin PDF export (orders/payments) share sheet ---
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

# --- App icon config (must have NO indentation) ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"